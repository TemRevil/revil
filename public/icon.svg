<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tem Revil monogram">
  <defs>
    <!-- thin lowercase r as a reusable stroked shape (no colour; set per use) -->
    <g id="r" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M205 190 V 344"/>
      <path d="M205 232 C 218 200, 262 182, 322 194"/>
    </g>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- White rounded tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#FFFFFF"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="#E4E7EC" stroke-width="2"/>

  <!-- Soft glow underlayer (the blurred red/blue split) -->
  <g filter="url(#glow)" opacity="0.6">
    <use href="#r" stroke="#FF3B3B" transform="translate(-17 -6)"/>
    <use href="#r" stroke="#3A86FF" transform="translate(17 6)"/>
  </g>

  <!-- Softly blurred RGB split: red ghost left, blue ghost right -->
  <g filter="url(#softBlur)">
    <use href="#r" stroke="#FF3B3B" transform="translate(-11 -4)"/>
    <use href="#r" stroke="#3A86FF" transform="translate(11 4)"/>
  </g>

  <!-- Crisp dark core on top -->
  <use href="#r" stroke="#16181D" transform="translate(0 0)"/>
</svg>
