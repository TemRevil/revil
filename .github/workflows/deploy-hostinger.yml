name: Release to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Once a day the site's Firestore snapshot is read again (see "Refresh the data snapshot"),
  # and the site is rebuilt only when the content changed since the last deploy.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  # A push cancels the release it replaces; the daily run never cancels a release in flight.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
  DEPLOY_ROOT: /home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/temrevil.com
  SITE_URL: https://temrevil.com/

# Every action is pinned to a full commit SHA (its release tag in the comment), so a moved
# tag can't run new code here.
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub's OIDC token buys a short-lived Google one
    outputs:
      ship: ${{ steps.ship.outputs.ship }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build bakes in a snapshot of the public Firestore content (scripts/sync-data.mjs).
      # A read-only service account, reached through Workload Identity Federation (no key
      # stored here), reads it fresh. Without that set up, or if the read fails, the build
      # uses the committed src/data/public.snapshot.json.
      - name: Authenticate to Google Cloud
        id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SNAPSHOT_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Refresh the data snapshot
        id: sync
        if: steps.gcp.outputs.access_token != ''
        continue-on-error: true
        env:
          FIRESTORE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          COMPARE_WITH: ${{ github.event_name == 'schedule' && 'https://temrevil.com/' || '' }}
        run: npm run sync:data

      # A push or a manual run always ships; the daily run only when the snapshot changed.
      - name: Decide whether to ship
        id: ship
        env:
          EVENT: ${{ github.event_name }}
          SYNCED: ${{ steps.sync.outcome }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [ "$EVENT" != "schedule" ] || { [ "$SYNCED" = "success" ] && [ "$CHANGED" = "true" ]; }; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to ship."
          fi

      - name: Lint
        if: steps.ship.outputs.ship == 'true'
        run: npm run lint

      - name: Shared code synced into functions
        if: steps.ship.outputs.ship == 'true'
        run: node functions/scripts/sync-shared.mjs --check

      - name: Type-check
        if: steps.ship.outputs.ship == 'true'
        run: npx tsc --noEmit

      - name: Unit tests
        if: steps.ship.outputs.ship == 'true'
        run: npm test

      - name: Build
        if: steps.ship.outputs.ship == 'true'
        run: npm run build

      - name: Upload static build artifact
        if: steps.ship.outputs.ship == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: validate
    if: needs.validate.outputs.ship == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://temrevil.com

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download static build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: deploy_bundle

      - name: Add Apache runtime config
        run: cp deploy/hostinger/.htaccess deploy_bundle/.htaccess

      - name: Create release archive
        run: tar -czf release.tgz -C deploy_bundle .

      # Key authentication against a pinned host key: the job refuses to connect to a server
      # whose key is not the one in HOSTINGER_KNOWN_HOSTS. The key and the host entry stay in
      # plain shell steps; no third-party action ever sees them.
      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing HOSTINGER_SSH_HOST"
          [ -n "$SSH_PORT" ] || missing="$missing HOSTINGER_SSH_PORT"
          [ -n "$SSH_USER" ] || missing="$missing HOSTINGER_SSH_USERNAME"
          [ -n "$SSH_KEY" ] || missing="$missing HOSTINGER_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing HOSTINGER_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Add these repository secrets:$missing (see README, Deploy)."
            exit 1
          fi

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error title=Bad deploy key::HOSTINGER_SSH_KEY is not a readable private key without a passphrase."
            exit 1
          fi
          entry="$SSH_HOST"
          [ "$SSH_PORT" = "22" ] || entry="[$SSH_HOST]:$SSH_PORT"
          if ! ssh-keygen -F "$entry" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error title=Host key not pinned::HOSTINGER_KNOWN_HOSTS has no line for the server. Paste the ssh-keyscan output (see README, Deploy)."
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ServerAliveInterval 15
          EOF

      # SSH to Hostinger occasionally fails with a transient connection timeout. Each step
      # tries up to 3 times, 15 s apart; activation is retried only when the connection
      # itself failed (ssh exit 255), and activate.sh is safe to run twice.
      - name: Upload the release
        run: |
          try() {
            for n in 1 2 3; do
              timeout 300 "$@" && return 0
              [ "$n" = 3 ] || { echo "Attempt $n failed; retrying in 15 s."; sleep 15; }
            done
            return 1
          }
          try ssh hostinger "mkdir -p '$DEPLOY_ROOT/.codex-deploy/incoming'"
          try scp release.tgz scripts/deploy/activate.sh scripts/deploy/rollback.sh "hostinger:$DEPLOY_ROOT/.codex-deploy/incoming/"

      - name: Activate the release
        id: activate
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for n in 1 2 3; do
            status=0
            ssh hostinger "DEPLOY_ROOT='$DEPLOY_ROOT' RELEASE_SHA='$RELEASE_SHA' bash '$DEPLOY_ROOT/.codex-deploy/incoming/activate.sh'" || status=$?
            [ "$status" = 0 ] && exit 0
            [ "$status" = 255 ] && [ "$n" != 3 ] || exit "$status"
            echo "Connection failed; retrying in 15 s."
            sleep 15
          done

      # The new release has to answer: the homepage with its baked data, and one of the
      # build's own hashed scripts (a new file, so no cache can answer for it).
      - name: Smoke test
        run: |
          page=$(mktemp)
          curl -fsS --retry 4 --retry-delay 5 --retry-all-errors -o "$page" "${SITE_URL}?release=${GITHUB_SHA}"
          grep -q 'id="public-data"' "$page" || { echo "::error::The homepage has no baked data."; exit 1; }
          asset=$(grep -o '/_next/static/[^"]*\.js' deploy_bundle/index.html | head -n 1)
          [ -n "$asset" ] || { echo "::error::No script found in the built homepage."; exit 1; }
          curl -fsS --retry 4 --retry-delay 5 --retry-all-errors -o /dev/null "${SITE_URL%/}${asset}"
          echo "The new release answers."

      - name: Roll back a release that failed its smoke test
        if: failure() && steps.activate.outcome == 'success'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh hostinger "DEPLOY_ROOT='$DEPLOY_ROOT' RELEASE_SHA='$RELEASE_SHA' bash '$DEPLOY_ROOT/.codex-deploy/incoming/rollback.sh'"
          curl -fsS -o /dev/null "${SITE_URL}?rollback=${GITHUB_SHA}" && echo "The previous release answers again."

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config

      # Tell Bing (and the other IndexNow engines: Yandex, Seznam, Naver) that the
      # sitemap's pages changed, so they recrawl now instead of whenever. The key file
      # is public/<key>.txt. A failed ping never fails the deploy. A daily run only gets
      # here when the content changed, so it pings too.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 6de522071a7266eec311b13b026e49f1
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' deploy_bundle/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -sc .)
          body=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "temrevil.com", key: $key, keyLocation: ("https://temrevil.com/" + $key + ".txt"), urlList: $urls}')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body"
