name: Release to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Once a day the site's Firestore snapshot is read again (see "Refresh the data snapshot"),
  # and the site is rebuilt only when the content changed since the last deploy.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  # A push cancels the release it replaces; the daily run never cancels a release in flight.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
  NEXT_PUBLIC_LLM_API_KEY: ${{ secrets.NEXT_PUBLIC_LLM_API_KEY }}
  DEPLOY_ROOT: /home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/temrevil.com

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub's OIDC token buys a short-lived Google one
    outputs:
      ship: ${{ steps.ship.outputs.ship }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build bakes in a snapshot of the public Firestore content (scripts/sync-data.mjs).
      # A read-only service account, reached through Workload Identity Federation (no key
      # stored here), reads it fresh. Without that set up, or if the read fails, the build
      # uses the committed src/data/public.snapshot.json.
      - name: Authenticate to Google Cloud
        id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SNAPSHOT_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Refresh the data snapshot
        id: sync
        if: steps.gcp.outputs.access_token != ''
        continue-on-error: true
        env:
          FIRESTORE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          COMPARE_WITH: ${{ github.event_name == 'schedule' && 'https://temrevil.com/' || '' }}
        run: npm run sync:data

      # A push or a manual run always ships; the daily run only when the snapshot changed.
      - name: Decide whether to ship
        id: ship
        env:
          EVENT: ${{ github.event_name }}
          SYNCED: ${{ steps.sync.outcome }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [ "$EVENT" != "schedule" ] || { [ "$SYNCED" = "success" ] && [ "$CHANGED" = "true" ]; }; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to ship."
          fi

      - name: Lint
        if: steps.ship.outputs.ship == 'true'
        run: npm run lint

      - name: Type-check
        if: steps.ship.outputs.ship == 'true'
        run: npx tsc --noEmit

      - name: Build
        if: steps.ship.outputs.ship == 'true'
        run: npm run build

      - name: Upload static build artifact
        if: steps.ship.outputs.ship == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist

  deploy:
    needs: validate
    if: needs.validate.outputs.ship == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://temrevil.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download static build artifact
        uses: actions/download-artifact@v5
        with:
          name: site-dist
          path: deploy_bundle

      - name: Add Apache runtime config
        run: cp deploy/hostinger/.htaccess deploy_bundle/.htaccess

      - name: Create release archive
        run: tar -czf release.tgz -C deploy_bundle .

      # SSH/SCP to Hostinger occasionally fails with a transient "dial tcp: i/o
      # timeout". We drive ssh/scp directly (sshpass) and wrap each in
      # nick-fields/retry: up to 3 attempts, 15s apart — bounded, not endless.
      # DEPLOY_ROOT/RELEASE_SHA are expanded locally then set for the remote shell.
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Prepare remote deploy directories
        uses: nick-fields/retry@v3.0.2
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' bash -s" <<'REMOTE'
            set -eu
            mkdir -p "$DEPLOY_ROOT/.codex-deploy/incoming"
            mkdir -p "$DEPLOY_ROOT/.codex-deploy/releases"
            mkdir -p "$DEPLOY_ROOT/.codex-deploy/backups"
            REMOTE

      - name: Upload release archive
        uses: nick-fields/retry@v3.0.2
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -P "$SSH_PORT" release.tgz "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/.codex-deploy/incoming/release.tgz"

      - name: Activate release on Hostinger
        uses: nick-fields/retry@v3.0.2
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
            set -eu
            CURRENT_DIR="$DEPLOY_ROOT/public_html"
            INCOMING_ARCHIVE="$DEPLOY_ROOT/.codex-deploy/incoming/release.tgz"
            STAGE_DIR="$DEPLOY_ROOT/.codex-deploy/releases/$RELEASE_SHA"
            BACKUP_DIR="$DEPLOY_ROOT/.codex-deploy/backups/$(date +%Y%m%d%H%M%S)"

            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR"
            tar -xzf "$INCOMING_ARCHIVE" -C "$STAGE_DIR"

            if [ -d "$CURRENT_DIR/.well-known" ]; then
              mkdir -p "$STAGE_DIR/.well-known"
              cp -a "$CURRENT_DIR/.well-known/." "$STAGE_DIR/.well-known/"
            fi

            mkdir -p "$BACKUP_DIR"
            mv "$CURRENT_DIR" "$BACKUP_DIR/public_html"
            mv "$STAGE_DIR" "$CURRENT_DIR"
            rm -f "$INCOMING_ARCHIVE"
            REMOTE

      # Tell Bing (and the other IndexNow engines: Yandex, Seznam, Naver) that the
      # sitemap's pages changed, so they recrawl now instead of whenever. The key file
      # is public/<key>.txt. A failed ping never fails the deploy.
      - name: Ping IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          INDEXNOW_KEY: 6de522071a7266eec311b13b026e49f1
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' deploy_bundle/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -sc .)
          body=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "temrevil.com", key: $key, keyLocation: ("https://temrevil.com/" + $key + ".txt"), urlList: $urls}')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body"
