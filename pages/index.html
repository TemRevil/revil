<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to temrevil.com</title>
  <!-- This page is published to GitHub Pages (temrevil.github.io/revil) and exists
       only to forward visitors to the canonical site. noindex avoids duplicate-content
       in search; the canonical points crawlers at the real domain. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://temrevil.com/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Fallback for no-JS clients / crawlers -->
  <meta http-equiv="refresh" content="0; url=https://temrevil.com/">
  <script>
    (function () {
      try {
        // Strip the /revil project-page prefix, then carry the remaining path
        // (e.g. a tracked link code), query string, and hash to the canonical domain.
        var p = location.pathname.replace(/^\/revil/, '');
        if (!p) p = '/';
        location.replace('https://temrevil.com' + p + location.search + location.hash);
      } catch (e) {
        location.replace('https://temrevil.com/');
      }
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #08090d; color: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; }
    a { color: #3395ff; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://temrevil.com/">temrevil.com</a>…</p>
</body>
</html>
